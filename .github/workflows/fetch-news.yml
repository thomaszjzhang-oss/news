name: Fetch News Timeline

on:
  schedule:
    # 北京时间 8:00 (UTC 0:00)
    - cron: '0 0 * * *'
    # 北京时间 14:00 (UTC 6:00)
    - cron: '0 6 * * *'
    # 北京时间 20:00 (UTC 12:00)
    - cron: '0 12 * * *'
  workflow_dispatch:  # 允许手动触发
  
permissions:
  contents: write  # 添加这一行，给予写入权限
  
jobs:
  fetch-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Fetch news and update timeline
        run: python scripts/fetch_news.py
        
      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add timeline.json index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update news timeline - $(date '+%Y-%m-%d %H:%M')"
          git push
