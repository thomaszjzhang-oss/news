<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际热点新闻聚合</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>国际热点新闻聚合</h1>
            <p class="subtitle">AP · Reuters · AFP · WSJ · Bloomberg</p>
            <p class="update-time" id="update-time">加载中...</p>
        </div>
    </header>

    <main class="container">
        <div class="stats" id="stats"></div>
        <div class="news-grid" id="news-grid"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载新闻...</p>
        </div>
        <div class="error" id="error" style="display: none;">
            <p>加载失败，请稍后刷新重试</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>数据来源于各国际媒体，仅供聚合展示，版权归原作者所有</p>
            <p>更新时间: 北京时间 08:00 / 14:00 / 20:00</p>
        </div>
    </footer>

    <script>
        const SOURCE_COLORS = {
            "AP": "#e63946",
            "Reuters": "#f4a261",
            "AFP": "#2a9d8f",
            "WSJ": "#264653",
            "Bloomberg": "#e9c46a",
        };

        async function loadNews() {
            const newsGrid = document.getElementById('news-grid');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const updateTime = document.getElementById('update-time');
            const stats = document.getElementById('stats');

            try {
                const response = await fetch('news.json?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to load');
                const data = await response.json();

                loading.style.display = 'none';

                // Update time
                const fetchTime = new Date(data.fetch_time);
                updateTime.textContent = `最后更新: ${fetchTime.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}`;

                // Stats
                stats.innerHTML = `
                    <span class="stat-item">共 ${data.total} 条新闻</span>
                    <span class="stat-item china-stat">🇨🇳 中国相关 ${data.china_related_count} 条</span>
                `;

                // Render news
                newsGrid.innerHTML = data.news.map((item, index) => `
                    <article class="news-card ${item.is_china_related ? 'china-related' : ''}" style="animation-delay: ${index * 50}ms">
                        <div class="news-header">
                            <span class="news-source" style="background-color: ${SOURCE_COLORS[item.source_key] || '#666'}">
                                ${item.source}
                            </span>
                            ${item.is_china_related ? '<span class="china-badge">🇨🇳 中国相关</span>' : ''}
                        </div>
                        <h2 class="news-title">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
                        </h2>
                        <div class="news-meta">
                            <span class="news-time">${formatTime(item.pub_timestamp)}</span>
                            ${item.original_source ? `<span class="original-source">${escapeHtml(item.original_source)}</span>` : ''}
                        </div>
                    </article>
                `).join('');

            } catch (e) {
                console.error('Error loading news:', e);
                loading.style.display = 'none';
                error.style.display = 'block';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp * 1000);
            const now = new Date();
            const diff = (now - date) / 1000;

            if (diff < 3600) {
                return Math.floor(diff / 60) + ' 分钟前';
            } else if (diff < 86400) {
                return Math.floor(diff / 3600) + ' 小时前';
            } else {
                return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
        }

        loadNews();
        // Auto refresh every 5 minutes
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
