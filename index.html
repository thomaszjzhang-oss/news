<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国际新闻时间线</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .timeline {
            position: relative;
            padding: 20px 0;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: rgba(255,255,255,0.3);
            top: 0;
        }
        .snapshot {
            margin-bottom: 60px;
            position: relative;
        }
        .snapshot-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }
        .time-badge {
            display: inline-block;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .time-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }
        .time-label {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }
        .time-text {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            padding: 0 20px;
        }
        .news-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .news-card.china-related {
            border-left: 4px solid #f56565;
        }
        .news-source {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-bottom: 10px;
        }
        .china-badge {
            display: inline-block;
            background: #f56565;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7em;
            margin-left: 8px;
        }
        .news-title {
            font-size: 1.05em;
            line-height: 1.6;
            color: #2d3748;
            margin-bottom: 12px;
        }
        .news-title a {
            color: #2d3748;
            text-decoration: none;
            transition: color 0.3s;
        }
        .news-title a:hover {
            color: #667eea;
        }
        .news-time {
            font-size: 0.85em;
            color: #a0aec0;
        }
        .stats {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 0.9em;
            opacity: 0.8;
        }
        @media (max-width: 768px) {
            .news-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8em;
            }
            .timeline::before {
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 国际新闻时间线</h1>
        <div class="timeline">

            <div class="snapshot">
                <div class="snapshot-header">
                    <div class="time-badge">
                        <div>
                            <span class="time-icon">☀️</span>
                            <span class="time-label">午间快讯</span>
                        </div>
                        <div class="time-text">2026年05月16日 13:02</div>
                    </div>
                </div>
                <div class="news-grid">

                    <div class="news-card ">
                        <div>
                            <span class="news-source">路透社</span>
                            
                        </div>
                        <div class="news-title">
                            <a href="https://news.google.com/rss/articles/CBMieEFVX3lxTFBUck1Sbm8zRl8wMmhjdDhHZGFJT01WaExXSmtuTEVaeHBrOTRPS3R3eUZ4UXZ2Rnc1cldSVEt6ODhpempJSE0ybEMwUDRLbExCSXphYTBOZ3o1UjFMRnlkMzhpN0kwa1hGZ2lOamFBWHJhN2I3Zzh1aQ?oc=5" target="_blank">多伦多证券交易所指数下跌1%，因债券市场暴跌打击市场情绪</a>
                        </div>
                        <div class="news-time">Fri, 15 May 2026 14:40:44 GMT</div>
                    </div>

                </div>
            </div>

        </div>
        <div class="stats">
            <p>共 1 个时间快照 | 数据来源：AP, Reuters, AFP, WSJ, Bloomberg</p>
            <p>最后更新：2026年05月16日 13:02</p>
        </div>
    </div>
</body>
</html>
